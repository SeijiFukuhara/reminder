# v から始まるタグ（例: v1.0.0）を push すると、Windows で Reminder.exe を作って Releases に公開する。
# Actions 画面から手動で実行した場合は、exe を Artifacts としてダウンロードできる。
name: Build exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build exe
        run: .\build.bat
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: Reminder
          path: dist/Reminder.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Reminder.exe
